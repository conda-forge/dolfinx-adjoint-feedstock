schema_version: 1

context:
  python_min: "3.12"
  version: "0.3.0"

package:
  name: dolfinx-adjoint
  version: ${{ version }}

source:
  url: "https://pypi.org/packages/source/d/dolfinx-adjoint/dolfinx_adjoint-${{ version }}.tar.gz"
  sha256: 4e6ceb5b59449e9bb3aa8c83503464f1b801fe60faf7e219291418db72ac1c9f

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation


requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=61.2
    - pip
  run:
    - python >=${{ python_min }}
    - pyadjoint
    - fenics-dolfinx >=0.11.0

tests:
  - python:
      imports:
        - dolfinx_adjoint
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Algorithmic differentiation framework for DOLFINx.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/scientificcomputing/dolfinx-adjoint

extra:
  recipe-maintainers:
    - finsberg
    - jorgensd
